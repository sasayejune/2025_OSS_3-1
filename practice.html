<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 데이터</title>
</head>
<body>
    <button id="get">학생 데이터 가져오기</button>
    <pre id="result"></pre> 
</body>
</html>

<script>
    document.getElementById("get").addEventListener("click", getData);

    function getData() {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", "http://localhost:3001/contents"); 
        xhr.send();

        xhr.onload = function() {
            if (xhr.status === 200) {

                document.getElementById("result").textContent = xhr.responseText;
            } else {
                console.error("에러 발생:", xhr.status);
            }
        };
    }
</script>
