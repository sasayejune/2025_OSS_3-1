<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 CRUD (json-server id 자동)</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  input { margin: 5px; }
  button { margin: 5px; }
  ul { margin-top: 20px; }
  li { margin-bottom: 10px; }
</style>
</head>
<body>

<h1>학생 관리 CRUD (json-server id 자동)</h1>

<!-- 입력 폼 -->
<input type="text" id="createName" placeholder="이름">
<input type="number" id="createAge" placeholder="나이">
<input type="text" id="createMajor" placeholder="전공">
<button id="btnAdd">추가(Create)</button>
<button id="btnRead">조회(Read)</button>

<ul id="studentList"></ul>

<script>
const apiUrl = "http://localhost:3001/students"; // json-server
const createName = document.getElementById("createName");
const createAge = document.getElementById("createAge");
const createMajor = document.getElementById("createMajor");
const studentList = document.getElementById("studentList");

function writeLog(...args) { console.log(...args); }

// ✅ 조회(Read)
async function getStudents() {
  try {
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error(`GET 오류: ${res.status}`);
    const students = await res.json();
    studentList.innerHTML = "";
    students.forEach(s => {
      const li = document.createElement("li");
      li.textContent = `${s.id} - ${s.name} (${s.age}세, ${s.major})`;

      // 수정 버튼
      const btnEdit = document.createElement("button");
      btnEdit.textContent = "수정(Update)";
      btnEdit.onclick = () => updateStudent(s.id);

      // 삭제 버튼
      const btnDelete = document.createElement("button");
      btnDelete.textContent = "삭제(Delete)";
      btnDelete.onclick = () => deleteStudent(s.id);

      li.appendChild(btnEdit);
      li.appendChild(btnDelete);
      studentList.appendChild(li);
    });
  } catch (err) {
    writeLog("조회 실패:", err.message);
  }
}

// ✅ 추가(Create) - id 자동 생성
async function createStudent() {
  const name = createName.value.trim();
  const age = Number(createAge.value);
  const major = createMajor.value.trim();
  if (!name || !major || !age) return alert("이름/나이/전공을 모두 입력하세요.");

  try {
    const newStudent = { name, age, major }; // id 제거!
    const res = await fetch(apiUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(newStudent)
    });
    if (!res.ok) throw new Error(`POST 오류: ${res.status}`);
    const data = await res.json();
    writeLog("추가 성공:", data);

    createName.value = "";
    createAge.value = "";
    createMajor.value = "";
    await getStudents();
  } catch (err) {
    writeLog("추가 실패:", err.message);
  }
}

// ✅ 수정(Update)
async function updateStudent(id) {
  const newName = prompt("새 이름:");
  const newAge = prompt("새 나이:");
  const newMajor = prompt("새 전공:");
  if (!newName || !newAge || !newMajor) return alert("모두 입력해야 합니다.");

  try {
    const res = await fetch(`${apiUrl}/${id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: newName, age: Number(newAge), major: newMajor })
    });
    if (!res.ok) throw new Error(`PATCH 오류: ${res.status}`);
    const data = await res.json();
    writeLog("수정 성공:", data);
    await getStudents();
  } catch (err) {
    writeLog("수정 실패:", err.message);
  }
}

// ✅ 삭제(Delete)
async function deleteStudent(id) {
  if (!confirm("정말 삭제할까요?")) return;
  try {
    const res = await fetch(`${apiUrl}/${id}`, { method: "DELETE" });
    if (!res.ok) throw new Error(`DELETE 오류: ${res.status}`);
    writeLog("삭제 성공: id", id);
    await getStudents();
  } catch (err) {
    writeLog("삭제 실패:", err.message);
  }
}

// 버튼 이벤트 연결
document.getElementById("btnAdd").addEventListener("click", createStudent);
document.getElementById("btnRead").addEventListener("click", getStudents);

// 페이지 로드 시 초기 목록
getStudents();
</script>
</body>
</html>
